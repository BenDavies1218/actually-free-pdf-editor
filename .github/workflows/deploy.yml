name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID set as repo secrets.
    # Remove this job if not using Vercel.
    if: ${{ vars.USE_VERCEL == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    # Requires NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID set as repo secrets.
    # Remove this job if not using Netlify.
    if: ${{ vars.USE_NETLIFY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir .
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
