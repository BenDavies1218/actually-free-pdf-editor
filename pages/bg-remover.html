<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../js/theme.js"></script>
    <title>Background Remover — Actually Free Tools</title>
    <meta
      name="description"
      content="Remove image backgrounds instantly in your browser. No uploads, no API key, free forever."
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/bgRemover.css" />

    <script type="importmap">
      {
        "imports": {
          "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0-dev.20250206-d981b153d3/dist/ort.mjs",
          "onnxruntime-web/webgpu": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0-dev.20250206-d981b153d3/dist/ort.webgpu.mjs",
          "onnxruntime-web/wasm": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0-dev.20250206-d981b153d3/dist/ort.wasm.mjs"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <a href="../index.html" class="logo">
        <i class="ti ti-sparkles"></i>
        <span class="shiny-text">Actually Free Tools</span>
      </a>
      <nav class="site-nav">
        <a href="pdf-editor.html" class="nav-link">
          <i class="ti ti-file-type-pdf"></i>
          <span>PDF Editor</span>
        </a>
        <a href="bg-remover.html" class="nav-link active">
          <i class="ti ti-eraser"></i>
          <span>BG Remover</span>
        </a>
        <a href="photo-editor.html" class="nav-link">
          <i class="ti ti-adjustments-horizontal"></i>
          <span>Photo Editor</span>
        </a>
      </nav>
      <div class="header-actions">
        <button class="btn-icon" id="theme-toggle" title="Toggle theme">
          <i class="ti ti-moon"></i>
        </button>
        <button class="btn-ghost" id="open-new-btn" style="display: none">
          <i class="ti ti-folder-open"></i>
          <span>New image</span>
        </button>
      </div>
    </header>

    <!-- Upload section -->
    <div id="upload-section" class="drop-zone dot-bg">
      <div class="drop-box card-beam" id="drop-box">
        <i class="ti ti-eraser"></i>
        <h2>Drop an image here</h2>
        <p>PNG, JPG, WebP supported</p>
        <div
          style="
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
          "
        >
          <button
            class="btn-primary"
            onclick="
              event.stopPropagation();
              imageInput.click();
            "
          >
            <i class="ti ti-photo-up"></i> Choose image
          </button>
        </div>
      </div>
    </div>

    <!-- Progress section -->
    <div class="progress-wrap" id="progress-section">
      <div class="spinner"></div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <p class="progress-label" id="progress-label">Loading...</p>
    </div>

    <!-- Editor section -->
    <div id="editor-section">
      <div class="result-toolbar">
        <span class="bg-label">Background</span>
        <div class="bg-swatch-row">
          <div
            class="bg-swatch transparent active"
            data-bg="transparent"
            title="Transparent"
          ></div>
          <div class="bg-swatch white" data-bg="white" title="White"></div>
          <div class="bg-swatch black" data-bg="black" title="Black"></div>
          <input
            type="color"
            class="bg-color-input"
            id="bg-color-picker"
            value="#6c63ff"
            title="Custom color"
          />
          <button class="bg-img-btn" id="bg-img-btn" title="Replace with image">
            <i class="ti ti-photo" id="bg-img-icon"></i>
          </button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-right">
          <button class="btn-ghost" id="open-new-btn2">
            <i class="ti ti-folder-open"></i>
            <span>New image</span>
          </button>
          <button class="btn-ghost" id="copy-btn">
            <i class="ti ti-copy"></i>
            <span>Copy</span>
          </button>
          <button class="btn-primary" id="download-btn">
            <i class="ti ti-download"></i>
            <span>Download PNG</span>
          </button>
        </div>
      </div>

      <div class="brush-bar" id="brush-bar">
        <span style="font-size: 0.82rem; color: var(--text-muted)"
          >Touch-up:</span
        >
        <button class="btn-ghost brush-mode-btn active" id="brush-erase-btn">
          <i class="ti ti-eraser"></i> Erase
        </button>
        <button class="btn-ghost brush-mode-btn" id="brush-restore-btn">
          <i class="ti ti-paint"></i> Restore
        </button>
        <span
          style="font-size: 0.82rem; color: var(--text-muted); margin-left: 8px"
          >Size</span
        >
        <input
          type="range"
          id="brush-size"
          min="3"
          max="60"
          value="15"
          style="width: 90px; accent-color: var(--accent)"
        />
        <span
          id="brush-size-val"
          style="font-size: 0.82rem; color: var(--accent); min-width: 24px"
          >15</span
        >
      </div>

      <div class="panels">
        <div class="panel">
          <div class="panel-label">Original</div>
          <div class="panel-canvas" id="original-panel">
            <img id="original-img" src="" alt="Original" />
          </div>
        </div>
        <div class="panel">
          <div class="panel-label">Background removed</div>
          <div class="panel-canvas checkerboard" id="result-panel">
            <div class="result-wrapper" id="result-wrapper">
              <canvas id="result-bg-canvas" style="display: none"></canvas>
              <canvas id="result-canvas"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <input type="file" id="imageInput" accept="image/*" style="display: none" />
    <input
      type="file"
      id="bgImageInput"
      accept="image/*"
      style="display: none"
    />
    <input
      type="file"
      id="batchInput"
      accept="image/*"
      multiple
      style="display: none"
    />
    <div id="toast-container"></div>

    <script type="module" src="../js/bgRemover.js"></script>
  </body>
</html>
