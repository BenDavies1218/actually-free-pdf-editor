<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="theme.js"></script>
    <title>PDF Editor — Actually Free Tools</title>
    <meta
      name="description"
      content="Free browser-based PDF editor. Rotate, delete pages, add text and images. No uploads."
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="shared.css" />

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- pdf-lib -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
      /* ── Editor Layout ── */
      #editor {
        flex: 1;
        display: none;
        flex-direction: column;
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }

      .toolbar-sep {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 4px;
        flex-shrink: 0;
      }

      .page-nav {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .page-input {
        width: 48px;
        padding: 6px 8px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 0.85rem;
        text-align: center;
      }

      .page-input:focus {
        outline: 2px solid var(--accent);
        border-color: transparent;
      }

      .page-total {
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .toolbar-right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .zoom-display {
        color: var(--text-muted);
        font-size: 0.82rem;
        min-width: 44px;
        text-align: center;
      }

      /* ── Editor body (sidebar + canvas) ── */
      #editor-body {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── Thumbnail panel ── */
      #thumb-panel {
        width: 150px;
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 8px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition:
          box-shadow 0.2s,
          background 0.2s;
      }

      #thumb-panel.selecting {
        background: rgba(245, 158, 11, 0.05);
        box-shadow:
          inset -3px 0 0 0 #f59e0b,
          0 0 24px -6px rgba(245, 158, 11, 0.4);
      }

      .thumb {
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 4px;
        padding: 4px;
        text-align: center;
        transition: border-color 0.15s;
        background: var(--surface2);
        user-select: none;
      }

      .thumb:hover {
        border-color: var(--border);
      }
      .thumb.active {
        border-color: var(--accent);
      }
      .thumb.selected {
        border-color: #f59e0b;
        background: rgba(245, 158, 11, 0.1);
      }
      .thumb canvas {
        display: block;
        width: 100%;
        border-radius: 2px;
        background: #fff;
      }
      .thumb span {
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 3px;
        display: block;
      }

      /* ── Canvas Area ── */
      #canvas-area {
        flex: 1;
        overflow: auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px 24px;
        background: var(--bg);
      }

      #canvas-wrapper {
        position: relative;
        box-shadow: var(--shadow);
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
        display: inline-block;
      }

      #pdf-canvas {
        display: block;
      }

      #annotation-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* ── Text annotations ── */
      .text-annotation {
        position: absolute;
        pointer-events: all;
        cursor: move;
        user-select: none;
      }

      .text-annotation span {
        display: block;
        padding: 3px 6px;
        background: rgba(255, 255, 0, 0.82);
        color: #000;
        font-size: 14px;
        font-family: sans-serif;
        border-radius: 3px;
        white-space: nowrap;
        border: 1px solid transparent;
      }

      .text-annotation:hover span {
        border-color: var(--accent);
      }

      .text-annotation .ann-del {
        position: absolute;
        top: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--danger);
        color: #fff;
        font-size: 10px;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        border: none;
        line-height: 1;
      }

      .text-annotation:hover .ann-del {
        display: flex;
      }

      /* ── Image annotations ── */
      .img-annotation {
        position: absolute;
        pointer-events: all;
        cursor: move;
        user-select: none;
      }

      .img-annotation img {
        display: block;
        border: 2px solid transparent;
        border-radius: 2px;
      }

      .img-annotation:hover img {
        border-color: var(--accent);
      }

      .img-annotation .ann-del {
        position: absolute;
        top: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--danger);
        color: #fff;
        font-size: 10px;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        border: none;
        line-height: 1;
      }

      .img-annotation:hover .ann-del {
        display: flex;
      }

      .ann-resize {
        position: absolute;
        bottom: -5px;
        right: -5px;
        width: 14px;
        height: 14px;
        background: var(--accent);
        border: 2px solid #fff;
        border-radius: 3px;
        cursor: se-resize;
        display: none;
      }

      .img-annotation:hover .ann-resize {
        display: block;
      }

      /* ── Extract active button ── */
      .btn-ghost.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      /* ── Success button ── */
      .btn-success {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        border: none;
        background: var(--success);
        color: #fff;
        transition: opacity 0.15s;
      }
      .btn-success:hover {
        opacity: 0.88;
      }

      /* ── Form fields popup ── */
      #form-fields-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 360px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .form-field-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-field-row label {
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .form-field-row.checkbox-row {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }

      .form-field-row input[type="checkbox"] {
        width: auto;
      }

      .form-fields-empty {
        color: var(--text-muted);
        font-size: 0.85rem;
        text-align: center;
        padding: 12px 0;
      }

      .form-flatten-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .form-flatten-row input {
        width: auto;
        margin: 0;
      }

      /* ── Watermark popup inputs ── */
      #watermark-popup input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 0.9rem;
        margin-bottom: 10px;
        box-sizing: border-box;
      }

      @media (max-width: 600px) {
        .toolbar {
          gap: 4px;
          padding: 8px 10px;
        }
        #canvas-area {
          padding: 16px 8px;
        }
        #thumb-panel {
          width: 100px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="logo">
        <i class="ti ti-sparkles"></i>
        <span class="shiny-text">Actually Free Tools</span>
      </a>
      <nav class="site-nav">
        <a href="pdf-editor.html" class="nav-link active">
          <i class="ti ti-file-type-pdf"></i>
          <span>PDF Editor</span>
        </a>
        <a href="bg-remover.html" class="nav-link">
          <i class="ti ti-eraser"></i>
          <span>BG Remover</span>
        </a>
        <a href="photo-editor.html" class="nav-link">
          <i class="ti ti-adjustments-horizontal"></i>
          <span>Photo Editor</span>
        </a>
      </nav>
      <div class="header-actions">
        <button class="btn-icon" id="theme-toggle" title="Toggle theme">
          <i class="ti ti-moon"></i>
        </button>
        <button class="btn-ghost" id="open-new-btn" style="display: none">
          <i class="ti ti-folder-open"></i>
          <span>Open</span>
        </button>
        <button
          class="btn-primary"
          id="download-btn"
          style="display: none"
          disabled
        >
          <i class="ti ti-download"></i>
          <span>Download PDF</span>
        </button>
      </div>
    </header>

    <!-- Drop zone -->
    <div class="drop-zone dot-bg" id="drop-zone">
      <div class="drop-box card-beam" id="drop-box">
        <i class="ti ti-cloud-upload"></i>
        <h2>Drop your PDF here</h2>
        <p>or click to choose a file</p>
        <button
          class="btn-primary"
          onclick="
            event.stopPropagation();
            fileInput.click();
          "
        >
          <i class="ti ti-file-upload"></i> Choose PDF
        </button>
      </div>
    </div>

    <!-- Hidden file inputs -->
    <input
      type="file"
      id="fileInput"
      accept="application/pdf"
      style="display: none"
    />
    <input type="file" id="imageInput" accept="image/*" style="display: none" />
    <input
      type="file"
      id="mergeInput"
      accept="application/pdf"
      multiple
      style="display: none"
    />

    <!-- Editor -->
    <div id="editor">
      <div class="toolbar">
        <div class="page-nav">
          <button class="btn-icon" id="prev-btn" title="Previous page">
            <i class="ti ti-chevron-left"></i>
          </button>
          <input
            type="number"
            class="page-input"
            id="page-input"
            min="1"
            value="1"
          />
          <span class="page-total">/ <span id="total-pages">1</span></span>
          <button class="btn-icon" id="next-btn" title="Next page">
            <i class="ti ti-chevron-right"></i>
          </button>
        </div>

        <div class="toolbar-sep"></div>

        <button class="btn-ghost" id="rotate-btn" title="Rotate page 90°">
          <i class="ti ti-rotate-clockwise"></i>
          <span>Rotate</span>
        </button>
        <button class="btn-danger" id="delete-btn" title="Delete current page">
          <i class="ti ti-trash"></i>
          <span>Delete page</span>
        </button>

        <div class="toolbar-sep"></div>

        <button class="btn-ghost" id="add-text-btn" title="Add text annotation">
          <i class="ti ti-text-size"></i>
          <span>Add text</span>
        </button>
        <button class="btn-ghost" id="add-image-btn" title="Add image">
          <i class="ti ti-photo"></i>
          <span>Add image</span>
        </button>

        <div class="toolbar-sep"></div>

        <button class="btn-ghost" id="merge-btn" title="Merge PDFs">
          <i class="ti ti-files"></i>
          <span>Merge</span>
        </button>
        <button class="btn-ghost" id="watermark-btn" title="Add watermark">
          <i class="ti ti-droplet"></i>
          <span>Watermark</span>
        </button>
        <button
          class="btn-ghost"
          id="form-fields-btn"
          title="Fill form fields"
          style="display: none"
        >
          <i class="ti ti-forms"></i>
          <span>Form Fields</span>
        </button>
        <button class="btn-ghost" id="extract-btn" title="Extract pages">
          <i class="ti ti-scissors"></i>
          <span>Extract</span>
        </button>
        <button
          class="btn-success"
          id="extract-confirm-btn"
          style="display: none"
        >
          Extract selected
        </button>
        <button class="btn-ghost" id="extract-cancel-btn" style="display: none">
          Cancel
        </button>

        <div class="toolbar-sep"></div>

        <button class="btn-icon" id="zoom-out-btn" title="Zoom out">
          <i class="ti ti-zoom-out"></i>
        </button>
        <span class="zoom-display" id="zoom-display">100%</span>
        <button class="btn-icon" id="zoom-in-btn" title="Zoom in">
          <i class="ti ti-zoom-in"></i>
        </button>
        <button class="btn-icon" id="zoom-fit-btn" title="Fit page">
          <i class="ti ti-arrows-maximize"></i>
        </button>

        <div class="toolbar-right">
          <button class="btn-primary" id="download-btn-2">
            <i class="ti ti-download"></i>
            <span>Download</span>
          </button>
        </div>
      </div>

      <div id="editor-body">
        <div id="thumb-panel"></div>
        <div id="canvas-area">
          <div id="canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <div id="annotation-layer"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Text annotation popup -->
    <div id="text-popup" class="popup-overlay">
      <div class="popup-box">
        <h3><i class="ti ti-text-size"></i> Add Text</h3>
        <input
          type="text"
          id="text-input"
          placeholder="Enter annotation text…"
          maxlength="200"
        />
        <div class="popup-row">
          <label>Size</label>
          <select id="font-size-select">
            <option value="12">12px</option>
            <option value="14" selected>14px</option>
            <option value="18">18px</option>
            <option value="24">24px</option>
            <option value="32">32px</option>
          </select>
        </div>
        <div class="popup-row">
          <label>Color</label>
          <input type="color" id="font-color-select" value="#000000" />
        </div>
        <div class="popup-actions">
          <button class="btn-ghost" id="text-cancel-btn">Cancel</button>
          <button class="btn-primary" id="text-confirm-btn">Add to Page</button>
        </div>
      </div>
    </div>

    <!-- Watermark popup -->
    <div id="watermark-popup" class="popup-overlay">
      <div class="popup-box">
        <h3><i class="ti ti-droplet"></i> Add Watermark</h3>
        <input
          type="text"
          id="wm-text"
          placeholder="Watermark text…"
          value="CONFIDENTIAL"
        />
        <div class="popup-row">
          <label>Opacity</label>
          <input
            type="range"
            id="wm-opacity"
            min="5"
            max="80"
            value="30"
            style="width: 120px"
          />
          <span id="wm-opacity-val">30%</span>
        </div>
        <div class="popup-row">
          <label>Angle</label>
          <input
            type="range"
            id="wm-angle"
            min="-90"
            max="90"
            value="45"
            style="width: 120px"
          />
          <span id="wm-angle-val">45°</span>
        </div>
        <div class="popup-row">
          <label>Size</label>
          <input
            type="range"
            id="wm-size"
            min="20"
            max="120"
            value="48"
            style="width: 120px"
          />
          <span id="wm-size-val">48</span>
        </div>
        <div class="popup-row">
          <label>Color</label>
          <input type="color" id="wm-color" value="#000000" />
        </div>
        <div class="popup-actions">
          <button class="btn-ghost" id="wm-cancel-btn">Cancel</button>
          <button class="btn-primary" id="wm-apply-btn">
            Apply to all pages
          </button>
        </div>
      </div>
    </div>

    <!-- Form fields popup -->
    <div id="form-fields-popup" class="popup-overlay">
      <div class="popup-box" style="max-width: 480px">
        <h3><i class="ti ti-forms"></i> Fill Form Fields</h3>
        <div id="form-fields-list"></div>
        <label class="form-flatten-row">
          <input type="checkbox" id="form-flatten-checkbox" />
          Flatten form after filling (makes values permanent, non-editable)
        </label>
        <div class="popup-actions">
          <button class="btn-ghost" id="form-fields-cancel-btn">Cancel</button>
          <button class="btn-primary" id="form-fields-apply-btn">Apply</button>
        </div>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p>Processing…</p>
    </div>

    <div id="toast-container"></div>

    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      let pdfDoc = null;
      let pdfLibDoc = null;
      let currentPage = 1;
      let totalPages = 0;
      let scale = 1.5;
      let annotations = {};
      let originalFileName = "edited.pdf";
      let dragFromPage = null;
      let extractMode = false;
      let selectedPages = new Set();

      const dropZoneEl = document.getElementById("drop-zone");
      const dropBox = document.getElementById("drop-box");
      const editor = document.getElementById("editor");
      const canvas = document.getElementById("pdf-canvas");
      const ctx = canvas.getContext("2d");
      const annLayer = document.getElementById("annotation-layer");
      const pageInput = document.getElementById("page-input");
      const totalEl = document.getElementById("total-pages");
      const zoomDisplay = document.getElementById("zoom-display");
      const loading = document.getElementById("loading");
      const textPopup = document.getElementById("text-popup");
      const textInput = document.getElementById("text-input");
      const fileInput = document.getElementById("fileInput");
      const imageInput = document.getElementById("imageInput");
      const mergeFileInput = document.getElementById("mergeInput");
      const thumbPanel = document.getElementById("thumb-panel");

      function toast(msg, type = "info") {
        const el = document.createElement("div");
        el.className =
          "toast" +
          (type === "error" ? " error" : type === "success" ? " success" : "");
        el.textContent = msg;
        document.getElementById("toast-container").appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }

      function showLoading(msg) {
        document.querySelector("#loading p").textContent = msg || "Processing…";
        loading.classList.add("show");
      }
      function hideLoading() {
        loading.classList.remove("show");
      }

      async function loadPDFBytes(bytes, name) {
        showLoading("Loading PDF…");
        try {
          originalFileName = name || "edited.pdf";
          pdfLibDoc = await PDFLib.PDFDocument.load(bytes, {
            ignoreEncryption: false,
          });
          const pdfData = new Uint8Array(bytes);
          pdfDoc = await pdfjsLib.getDocument({ data: pdfData }).promise;

          totalPages = pdfDoc.numPages;
          currentPage = 1;
          annotations = {};

          totalEl.textContent = totalPages;
          pageInput.max = totalPages;

          dropZoneEl.style.display = "none";
          editor.style.display = "flex";
          document.getElementById("open-new-btn").style.display = "";
          document.getElementById("download-btn").style.display = "";
          document.getElementById("download-btn").disabled = false;

          await renderPage(currentPage);
          await renderAllThumbnails();
          updateFormFieldsAvailability();
          toast(
            "PDF loaded — " +
              totalPages +
              " page" +
              (totalPages !== 1 ? "s" : ""),
            "success",
          );
        } catch (e) {
          toast("Failed to open PDF: " + e.message, "error");
          console.error(e);
        } finally {
          hideLoading();
        }
      }

      function readFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }

      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.type !== "application/pdf") {
          toast("Please select a PDF file", "error");
          return;
        }
        const bytes = await readFile(file);
        await loadPDFBytes(bytes, file.name);
        fileInput.value = "";
      });

      dropBox.addEventListener("click", () => fileInput.click());
      dropBox.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropBox.classList.add("dragover");
      });
      dropBox.addEventListener("dragleave", () =>
        dropBox.classList.remove("dragover"),
      );
      dropBox.addEventListener("drop", async (e) => {
        e.preventDefault();
        dropBox.classList.remove("dragover");
        const file = e.dataTransfer.files[0];
        if (!file || file.type !== "application/pdf") {
          toast("Please drop a PDF file", "error");
          return;
        }
        const bytes = await readFile(file);
        await loadPDFBytes(bytes, file.name);
      });

      document
        .getElementById("open-new-btn")
        .addEventListener("click", () => fileInput.click());

      async function renderPage(num) {
        if (!pdfDoc) return;
        currentPage = Math.max(1, Math.min(num, totalPages));
        pageInput.value = currentPage;

        const page = await pdfDoc.getPage(currentPage);
        const viewport = page.getViewport({ scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = viewport.width + "px";
        canvas.style.height = viewport.height + "px";
        annLayer.style.width = viewport.width + "px";
        annLayer.style.height = viewport.height + "px";

        await page.render({ canvasContext: ctx, viewport }).promise;
        updateNavButtons();
        renderAnnotations();

        document.querySelectorAll(".thumb").forEach((t) => {
          t.classList.toggle("active", +t.dataset.page === currentPage);
          t.classList.toggle(
            "selected",
            extractMode && selectedPages.has(+t.dataset.page),
          );
        });
      }

      function updateNavButtons() {
        document.getElementById("prev-btn").disabled = currentPage <= 1;
        document.getElementById("next-btn").disabled =
          currentPage >= totalPages;
        document.getElementById("delete-btn").disabled = totalPages <= 1;
      }

      function renderAnnotations() {
        annLayer.innerHTML = "";
        const pageAnns = annotations[currentPage] || [];
        pageAnns.forEach((ann, idx) => {
          if (ann.type === "image") renderImageAnnotation(ann, idx);
          else renderTextAnnotation(ann, idx);
        });
      }

      function renderTextAnnotation(ann, idx) {
        const el = document.createElement("div");
        el.className = "text-annotation";
        el.style.left = ann.x + "px";
        el.style.top = ann.y + "px";

        const span = document.createElement("span");
        span.textContent = ann.text;
        span.style.fontSize = ann.fontSize + "px";

      function renderImageAnnotation(ann, idx) {
        const el = document.createElement("div");
        el.className = "img-annotation";
        el.style.left = ann.x + "px";
        el.style.top = ann.y + "px";

        const img = document.createElement("img");
        img.src = ann.dataUrl;
        img.draggable = false;
        img.style.width = ann.width + "px";
        img.style.height = ann.height + "px";

        const del = document.createElement("button");
        del.className = "ann-del";
        del.innerHTML = "&times;";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          annotations[currentPage].splice(idx, 1);
          renderAnnotations();
        });

        const resizeHandle = document.createElement("div");
        resizeHandle.className = "ann-resize";
        resizeHandle.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          e.preventDefault();
          const aspect = ann.width / ann.height;
          const startX = e.clientX;
          const startW = ann.width;
          function onMove(ev) {
            const newW = Math.max(20, startW + (ev.clientX - startX));
            ann.width = newW;
            ann.height = newW / aspect;
            img.style.width = ann.width + "px";
            img.style.height = ann.height + "px";
          }
          function onUp() {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
          }
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });

        el.appendChild(img);
        el.appendChild(del);
        el.appendChild(resizeHandle);
        el.addEventListener("mousedown", startDrag(ann, el));
        annLayer.appendChild(el);
      }

      function startDrag(ann, el) {
        return function (e) {
          if (
            e.target.classList.contains("ann-del") ||
            e.target.classList.contains("ann-resize")
          )
            return;
          e.preventDefault();
          const startX = e.clientX - ann.x;
          const startY = e.clientY - ann.y;
          function onMove(ev) {
            ann.x = ev.clientX - startX;
            ann.y = ev.clientY - startY;
            el.style.left = ann.x + "px";
            el.style.top = ann.y + "px";
          }
          function onUp() {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
          }
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        };
      }

        if (!file) return;
        if (!file.type.startsWith("image/")) {

          return;
        }

        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (ev) => resolve(ev.target.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        const dims = await new Promise((resolve) => {
          const img = new Image();
          img.onload = () =>
            resolve({ w: img.naturalWidth, h: img.naturalHeight });
          img.src = dataUrl;
        });

        const maxW = canvas.width * 0.4;
        const ratio = dims.w > maxW ? maxW / dims.w : 1;

        if (!annotations[currentPage]) annotations[currentPage] = [];
        annotations[currentPage].push({
          type: "image",
          x: 40,
          y: 40,
          width: Math.round(dims.w * ratio),
          height: Math.round(dims.h * ratio),
          dataUrl,
          mimeType: file.type,
        });

        renderAnnotations();
        imageInput.value = "";
        toast("Image added — drag to position, corner handle to resize");
      });

      function dataUrlToBytes(dataUrl) {
        const base64 = dataUrl.split(",")[1];
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function toPngBytes(dataUrl) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas");
            c.width = img.naturalWidth;
            c.height = img.naturalHeight;
            c.getContext("2d").drawImage(img, 0, 0);
            resolve(dataUrlToBytes(c.toDataURL("image/png")));
          };
          img.src = dataUrl;
        });
      }

      async function downloadPDF() {
        if (!pdfLibDoc) return;
        showLoading("Saving PDF…");
        try {
          const pages = pdfLibDoc.getPages();
          const font = await pdfLibDoc.embedFont(
            PDFLib.StandardFonts.Helvetica,
          );

          for (const [pageNum, anns] of Object.entries(annotations)) {
            if (!anns.length) continue;
            const page = pages[parseInt(pageNum, 10) - 1];
            if (!page) continue;
            const { width, height } = page.getSize();

            for (const ann of anns) {
              const scaleX = width / canvas.width;
              const scaleY = height / canvas.height;

              if (ann.type === "image") {
                const mime = ann.mimeType || "";
                let embeddedImg;
                if (mime === "image/jpeg" || mime === "image/jpg") {
                  embeddedImg = await pdfLibDoc.embedJpg(
                    dataUrlToBytes(ann.dataUrl),
                  );
                } else {
                  embeddedImg = await pdfLibDoc.embedPng(
                    await toPngBytes(ann.dataUrl),
                  );
                }
                const pdfW = ann.width * scaleX;
                const pdfH = ann.height * scaleY;
                page.drawImage(embeddedImg, {
                  x: Math.max(0, ann.x * scaleX),
                  y: Math.max(0, height - ann.y * scaleY - pdfH),
                  width: pdfW,
                  height: pdfH,
                });
              } else {
                const hex = ann.color.replace("#", "");
                const r = parseInt(hex.substring(0, 2), 16) / 255;
                const g = parseInt(hex.substring(2, 4), 16) / 255;
                const b = parseInt(hex.substring(4, 6), 16) / 255;
                page.drawText(ann.text, {
                  x: Math.max(0, ann.x * scaleX),
                  y: Math.max(
                    0,
                    height - ann.y * scaleY - ann.fontSize * scaleY,
                  ),
                  size: ann.fontSize,
                  font,
                  color: PDFLib.rgb(r, g, b),
                });
              }
            }
          }

          const bytes = await pdfLibDoc.save();
          const blob = new Blob([bytes], { type: "application/pdf" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = originalFileName.replace(/\.pdf$/i, "") + "-edited.pdf";
          a.click();
          URL.revokeObjectURL(url);
          toast("PDF downloaded!", "success");
        } catch (e) {
          toast("Download failed: " + e.message, "error");
          console.error(e);
        } finally {
          hideLoading();
        }
      }

      async function reorderPages(fromPage, toPage) {
        if (fromPage === toPage) return;
        showLoading("Reordering pages…");
        try {
          const n = totalPages;
          const order = Array.from({ length: n }, (_, i) => i);
          const [removed] = order.splice(fromPage - 1, 1);
          order.splice(toPage - 1, 0, removed);

          const newDoc = await PDFLib.PDFDocument.create();
          const copied = await newDoc.copyPages(pdfLibDoc, order);
          copied.forEach((p) => newDoc.addPage(p));
          const bytes = await newDoc.save();
          pdfLibDoc = await PDFLib.PDFDocument.load(bytes);
          pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) })
            .promise;

          const newAnns = {};
          order.forEach((origIdx, newIdx) => {
            const orig = origIdx + 1,
              dest = newIdx + 1;
            if (annotations[orig]) newAnns[dest] = annotations[orig];
          });
          annotations = newAnns;

          currentPage = toPage;
          await renderPage(currentPage);
          await renderAllThumbnails();
          updateFormFieldsAvailability();
          toast("Page moved");
        } catch (e) {
          toast("Reorder failed: " + e.message, "error");
        } finally {
          hideLoading();
        }
      }

      // ── Feature 6: Fill existing form fields (AcroForm) ──

      function updateFormFieldsAvailability() {
        const btn = document.getElementById("form-fields-btn");
        let hasFields = false;
        try {
          if (
            pdfLibDoc &&
            pdfLibDoc.catalog.has(PDFLib.PDFName.of("AcroForm"))
          ) {
            hasFields = pdfLibDoc.getForm().getFields().length > 0;
          }
        } catch (e) {
          hasFields = false;

        btn.style.display = hasFields ? "" : "none";
      }

      function buildFormFieldsList() {
        const form = pdfLibDoc.getForm();
        const listEl = document.getElementById("form-fields-list");
        listEl.innerHTML = "";

        form.getFields().forEach((field) => {
          const name = field.getName();
          const row = document.createElement("div");
          row.className = "form-field-row";

          const label = document.createElement("label");
          label.textContent = name;

          let input;
          if (field instanceof PDFLib.PDFTextField) {
            input = document.createElement("input");
            input.type = "text";
            input.value = field.getText() || "";
            input.dataset.fieldType = "text";
          } else if (field instanceof PDFLib.PDFCheckBox) {
            input = document.createElement("input");
            input.type = "checkbox";
            input.checked = field.isChecked();
            input.dataset.fieldType = "checkbox";
            row.classList.add("checkbox-row");
          } else if (
            field instanceof PDFLib.PDFDropdown ||
            field instanceof PDFLib.PDFOptionList
          ) {
            input = document.createElement("select");
            input.multiple = field instanceof PDFLib.PDFOptionList;
            const selected = field.getSelected();
            field.getOptions().forEach((opt) => {
              const optionEl = document.createElement("option");
              optionEl.value = opt;
              optionEl.textContent = opt;
              optionEl.selected = selected.includes(opt);
              input.appendChild(optionEl);
            });
            input.dataset.fieldType = "select";
          } else if (field instanceof PDFLib.PDFRadioGroup) {
            input = document.createElement("select");
            const selected = field.getSelected();
            field.getOptions().forEach((opt) => {
              const optionEl = document.createElement("option");
              optionEl.value = opt;
              optionEl.textContent = opt;
              optionEl.selected = opt === selected;
              input.appendChild(optionEl);
            });
            input.dataset.fieldType = "radio";
          } else {
            return; // push buttons, signatures — not fillable
          }

          input.dataset.fieldName = name;

          if (field.isReadOnly && field.isReadOnly()) input.disabled = true;

          row.appendChild(input);
          if (row.classList.contains("checkbox-row")) {
            row.appendChild(label);
          } else {
            row.insertBefore(label, input);
          }
          listEl.appendChild(row);
        });

        if (!listEl.children.length) {
          listEl.innerHTML =
            '<p class="form-fields-empty">No fillable fields found.</p>';
        }
      }

      document
        .getElementById("form-fields-btn")
        .addEventListener("click", () => {
          if (!pdfLibDoc) return;
          buildFormFieldsList();
          document.getElementById("form-flatten-checkbox").checked = false;
          document.getElementById("form-fields-popup").classList.add("open");
        });

      document
        .getElementById("form-fields-cancel-btn")
        .addEventListener("click", () => {
          document.getElementById("form-fields-popup").classList.remove("open");
        });

      document
        .getElementById("form-fields-popup")
        .addEventListener("click", (e) => {
          if (e.target === document.getElementById("form-fields-popup"))
            document
              .getElementById("form-fields-popup")
              .classList.remove("open");
        });

      document
        .getElementById("form-fields-apply-btn")
        .addEventListener("click", async () => {
          if (!pdfLibDoc) return;
          const form = pdfLibDoc.getForm();
          const listEl = document.getElementById("form-fields-list");
          const flatten = document.getElementById(
            "form-flatten-checkbox",
          ).checked;
          document.getElementById("form-fields-popup").classList.remove("open");
          showLoading("Updating form fields…");
          try {
            listEl.querySelectorAll("[data-field-name]").forEach((input) => {
              const field = form.getField(input.dataset.fieldName);
              const type = input.dataset.fieldType;
              if (type === "text") {
                field.setText(input.value);
              } else if (type === "checkbox") {
                if (input.checked) field.check();
                else field.uncheck();
              } else if (type === "select") {
                const values = Array.from(input.selectedOptions).map(
                  (o) => o.value,
                );
                field.select(values.length === 1 ? values[0] : values);
              } else if (type === "radio") {
                field.select(input.value);
              }
            });

            if (flatten) form.flatten();

            const bytes = await pdfLibDoc.save();
            pdfLibDoc = await PDFLib.PDFDocument.load(bytes);
            pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) })
              .promise;
            await renderPage(currentPage);
            await renderAllThumbnails();
            updateFormFieldsAvailability();
            toast(
              flatten ? "Form filled and flattened" : "Form fields updated",
              "success",
            );
          } catch (e) {
            toast("Failed to update form: " + e.message, "error");
          } finally {
            hideLoading();
          }
        });
    </script>
  </body>
</html>
